[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lbry-downloader"
version = "1.0.0"
description = "Incremental sync tool for LBRY/Odysee channels"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "LBRY Downloader Contributors"}
]
keywords = ["lbry", "odysee", "download", "sync", "archive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
    "Topic :: System :: Archiving",
]
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
]

[project.scripts]
lbry-downloader = "main:main"

[project.urls]
Homepage = "https://github.com/yourusername/LBRY-Downloader"
Repository = "https://github.com/yourusername/LBRY-Downloader"
Issues = "https://github.com/yourusername/LBRY-Downloader/issues"

[tool.setuptools]
py-modules = [
    "main",
    "models",
    "utils",
    "config_loader",
    "lbry_client",
    "state_db",
    "planner",
    "downloader",
    "offline_site",
]
